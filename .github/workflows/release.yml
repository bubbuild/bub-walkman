name: Release

# Push a tag like v0.2.0 to build, publish to PyPI and create a GitHub release.
# PyPI uses trusted publishing (OIDC): no API token is stored in the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tag
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: astral-sh/setup-uv@v10.3.3 # no major-version tags upstream
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - name: Check the version matches the tag and the wheel ships the web UI
        run: |
          expected="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "tag $GITHUB_REF_NAME -> $version"
          test "$version" = "$expected"
          unzip -l "$wheel" | grep -c 'bub_walkman/static/index.html' > /dev/null  # -c reads all input: no SIGPIPE under pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke "$wheel"
          /tmp/smoke/bin/bub-walkman --version | grep -qx "bub-walkman $expected"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bub-walkman
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Tags with a PEP 440 pre-release segment (v1.0.0a1, v1.0.0b2, v1.0.0rc1) are marked as pre-releases.
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "${GITHUB_REF_NAME#v}" =~ (a|b|rc)[0-9]+$ ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
