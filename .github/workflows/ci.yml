name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web typecheck
      - run: pnpm -C web test
      - run: pnpm -C web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-ui
          path: src/bub_walkman/static
          if-no-files-found: error

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no major-version tags upstream
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uvx ruff check src tests
        if: matrix.python == '3.12'
      - run: uv run pytest

  package:
    name: Build and smoke-test the package
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: actions/download-artifact@v8
        with:
          name: web-ui
          path: src/bub_walkman/static
      - uses: astral-sh/setup-uv@v10.3.3 # no major-version tags upstream
        with:
          python-version: "3.12"
      - run: uv build
      - name: Check the wheel ships the web UI and runs
        run: |
          unzip -l dist/*.whl | grep -c 'bub_walkman/static/index.html' > /dev/null  # -c reads all input: no SIGPIPE under pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/bub-walkman --version
